<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agendo · Panel</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
    <script src="/vendor/fullcalendar.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#/inicio" aria-label="Agendo, ir al resumen">
        <img src="/logo.svg" alt="" width="34" height="34" />
        <span>Agendo</span>
      </a>

      <label class="business-pick">
        <span class="label">Negocio</span>
        <span class="select-wrap">
          <span class="dot" id="business-dot"></span>
          <select id="tenant" aria-label="Elegir negocio"></select>
        </span>
      </label>

      <nav class="nav" aria-label="Secciones">
        <p class="nav-group">Día a día</p>
        <a href="#/inicio" data-route="inicio"
          ><svg><use href="#i-home" /></svg>Resumen</a
        >
        <a href="#/agenda" data-route="agenda"
          ><svg><use href="#i-calendar" /></svg>Agenda</a
        >
        <a href="#/citas" data-route="citas"
          ><svg><use href="#i-table" /></svg>Listado de citas</a
        >
        <a href="#/conversaciones" data-route="conversaciones"
          ><svg><use href="#i-chat" /></svg>Conversaciones<b class="nav-badge" id="handoff-badge" hidden></b
        ></a>
        <p class="nav-group">Configuración</p>
        <a href="#/negocio" data-route="negocio"
          ><svg><use href="#i-store" /></svg>Mi negocio</a
        >
        <a href="#/whatsapp" data-route="whatsapp"
          ><svg><use href="#i-phone" /></svg>WhatsApp</a
        >
        <a href="#/actividad" data-route="actividad"
          ><svg><use href="#i-activity" /></svg>Actividad</a
        >
      </nav>

      <div class="sidebar-foot">
        <div class="health" id="health" aria-live="polite"></div>
        <form method="post" action="/logout">
          <button class="btn btn-quiet btn-block" type="submit">
            <svg><use href="#i-logout" /></svg>Cerrar sesión
          </button>
        </form>
      </div>
    </aside>

    <main id="view" tabindex="-1"></main>
    <div id="drawer-backdrop" class="backdrop" hidden></div>
    <aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog"></aside>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
        </symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="3" />
          <path d="M8 3v4M16 3v4M3 10h18" />
        </symbol>
        <symbol id="i-table" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M3 10h18M3 15h18M9 10v10" />
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24">
          <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12Z" />
        </symbol>
        <symbol id="i-store" viewBox="0 0 24 24">
          <path
            d="M4 9.5 5.5 4h13L20 9.5M4 9.5V20h16V9.5M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M10 20v-5h4v5"
          />
        </symbol>
        <symbol id="i-phone" viewBox="0 0 24 24">
          <rect x="6.5" y="2.5" width="11" height="19" rx="2.5" />
          <path d="M11 18h2" />
        </symbol>
        <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4" /></symbol>
        <symbol id="i-logout" viewBox="0 0 24 24">
          <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10" />
        </symbol>
        <symbol id="i-sparkle" viewBox="0 0 24 24">
          <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6" />
        </symbol>
        <symbol id="i-google" viewBox="0 0 24 24">
          <path
            d="M20 12.2c0-.6 0-1.1-.1-1.7H12v3.3h4.5a4 4 0 0 1-1.7 2.6v2.2h2.8c1.6-1.5 2.4-3.7 2.4-6.4Z"
          />
          <path
            d="M12 20.5c2.3 0 4.2-.8 5.6-2l-2.8-2.2c-.8.5-1.7.8-2.8.8-2.2 0-4-1.5-4.7-3.4H4.4v2.2A8.5 8.5 0 0 0 12 20.5Z"
          />
          <path d="M7.3 13.7a5 5 0 0 1 0-3.4V8.1H4.4a8.5 8.5 0 0 0 0 7.8z" />
          <path d="M12 6.9c1.3 0 2.4.4 3.3 1.3l2.5-2.5A8.5 8.5 0 0 0 4.4 8.1l2.9 2.2C8 8.4 9.8 6.9 12 6.9Z" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="12" rx="2" />
          <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
        </symbol>
        <symbol id="i-external" viewBox="0 0 24 24">
          <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21a8 8 0 0 1 16 0" />
        </symbol>
      </defs>
    </svg>
  </body>
</html>
